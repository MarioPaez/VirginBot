# Fly.io — VirginBot. Cambia `app` por un nombre único antes de desplegar.
app = "virginbot"
primary_region = "fra" # Fráncfort: región Fly más cercana a Milán (Fly no tiene Italia)

[build]

[env]
  ADDR = ":8080"
  VIRGINBOT_DB = "/data/virginbot.db"

[http_service]
  internal_port = 8080
  force_https = true
  # El motor de automatización debe correr 24/7 para reservar al abrir el plazo:
  # NO apagamos la máquina por inactividad.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# Volumen persistente para la BD SQLite (1 sola máquina: SQLite es un solo escritor).
[mounts]
  source = "virginbot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
